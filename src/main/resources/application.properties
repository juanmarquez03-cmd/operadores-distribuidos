spring.application.name=ejercicio11

# Conexion a PostgreSQL. Se puede sobreescribir con las variables de entorno
# DB_URL, DB_USER y DB_PASS.
spring.datasource.url=${DB_URL:jdbc:postgresql://10.200.11.203:5432/personasdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASS:appclave2026}

# Pool de conexiones limitado.
spring.datasource.hikari.maximum-pool-size=5

# La tabla personas ya existe: Hibernate no debe crearla ni modificarla.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
